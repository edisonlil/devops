<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Web 系统测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }
        .section h2 {
            margin-top: 0;
            color: #1f2937;
        }
        .api-test {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-secondary {
            background: #6b7280;
            color: white;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .status.success {
            background: #dcfce7;
            color: #166534;
        }
        .status.error {
            background: #fef2f2;
            color: #dc2626;
        }
        .status.pending {
            background: #fef3c7;
            color: #d97706;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DevOps Web 系统测试</h1>
        <p>测试 DevOps Web 系统的各个组件和 API 接口</p>

        <!-- 后端健康检查 -->
        <div class="section">
            <h2>🔧 后端服务状态</h2>
            <div class="api-test">
                <button class="btn btn-primary" onclick="testHealth()">健康检查</button>
                <button class="btn btn-secondary" onclick="testSystemInfo()">系统信息</button>
                <span id="backend-status" class="status pending">未测试</span>
            </div>
            <div id="health-result" class="result" style="display: none;"></div>
        </div>

        <!-- 模板 API 测试 -->
        <div class="section">
            <h2>📋 模板管理 API</h2>
            <div class="api-test">
                <button class="btn btn-primary" onclick="testTemplates()">获取模板列表</button>
                <button class="btn btn-secondary" onclick="testTemplateDetail()">获取模板详情</button>
                <span id="templates-status" class="status pending">未测试</span>
            </div>
            <div id="templates-result" class="result" style="display: none;"></div>
        </div>

        <!-- 工作空间 API 测试 -->
        <div class="section">
            <h2>🏢 工作空间 API</h2>
            <div class="api-test">
                <button class="btn btn-primary" onclick="testWorkspaces()">获取工作空间</button>
                <span id="workspaces-status" class="status pending">未测试</span>
            </div>
            <div id="workspaces-result" class="result" style="display: none;"></div>
        </div>

        <!-- 前端页面测试 -->
        <div class="section">
            <h2>🖥️ 前端页面</h2>
            <div class="api-test">
                <button class="btn btn-primary" onclick="openFrontend()">打开前端应用</button>
                <button class="btn btn-secondary" onclick="openTemplates()">打开模板管理</button>
                <span id="frontend-status" class="status pending">点击测试</span>
            </div>
        </div>

        <!-- DevOps 命令测试 -->
        <div class="section">
            <h2>⚙️ DevOps 命令</h2>
            <div class="api-test">
                <button class="btn btn-primary" onclick="testDevopsVersion()">版本信息</button>
                <span id="devops-status" class="status pending">未测试</span>
            </div>
            <div id="devops-result" class="result" style="display: none;"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        async function makeRequest(url, options = {}) {
            try {
                const response = await fetch(url, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });
                
                const data = await response.json();
                return { success: response.ok, data, status: response.status };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        function updateStatus(elementId, success, message = '') {
            const element = document.getElementById(elementId);
            element.className = `status ${success ? 'success' : 'error'}`;
            element.textContent = success ? '✅ 正常' : '❌ 异常';
            if (message) {
                element.title = message;
            }
        }

        function showResult(elementId, content) {
            const element = document.getElementById(elementId);
            element.textContent = JSON.stringify(content, null, 2);
            element.style.display = 'block';
        }

        async function testHealth() {
            const result = await makeRequest(`${API_BASE}/health`);
            updateStatus('backend-status', result.success);
            showResult('health-result', result);
        }

        async function testSystemInfo() {
            const result = await makeRequest(`${API_BASE}/system/info`);
            updateStatus('backend-status', result.success);
            showResult('health-result', result);
        }

        async function testTemplates() {
            const result = await makeRequest(`${API_BASE}/templates`);
            updateStatus('templates-status', result.success);
            showResult('templates-result', result);
        }

        async function testTemplateDetail() {
            const result = await makeRequest(`${API_BASE}/templates/1`);
            updateStatus('templates-status', result.success);
            showResult('templates-result', result);
        }

        async function testWorkspaces() {
            const result = await makeRequest(`${API_BASE}/workspace`);
            updateStatus('workspaces-status', result.success);
            showResult('workspaces-result', result);
        }

        async function testDevopsVersion() {
            const result = await makeRequest(`${API_BASE}/system/info`);
            updateStatus('devops-status', result.success);
            showResult('devops-result', result);
        }

        function openFrontend() {
            window.open('/', '_blank');
            updateStatus('frontend-status', true, '已打开前端应用');
        }

        function openTemplates() {
            window.open('/templates', '_blank');
            updateStatus('frontend-status', true, '已打开模板管理');
        }

        // 页面加载时自动测试健康检查
        window.onload = function() {
            testHealth();
        };
    </script>
</body>
</html>
