version: '3.8'

services:
  ?module_name:
    image: ?image_path
    ports:
      - "?app_port:?app_port"
    environment:
      - NODE_ENV=production
      - PORT=?app_port
      - APP_NAME=?module_name
    networks:
      - ?module_name-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3
      rollback_config:
        parallelism: 1
        delay: 5s
        failure_action: pause
        monitor: 60s
        max_failure_ratio: 0.3
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
      placement:
        constraints:
          - node.role == worker
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - nodejs-logs:/app/logs

networks:
  ?module_name-network:
    driver: overlay
    attachable: true

volumes:
  nodejs-logs:
    driver: local
