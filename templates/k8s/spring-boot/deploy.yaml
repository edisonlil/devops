apiVersion: apps/v1
kind: Deployment
metadata:
  name: ?module_name
  namespace: ?namespace
  labels:
    app: ?module_name
    version: "1.0"
spec:
  replicas: ?replicas
  selector:
    matchLabels:
      app: ?module_name
  template:
    metadata:
      labels:
        app: ?module_name
        version: "1.0"
    spec:
      containers:
      - name: ?module_name
        image: ?image_path
        ports:
        - containerPort: ?app_port
          name: http
      imagePullSecrets:
      - name: ?harbor_secret_name
        env:
        - name: JAVA_OPTS
          value: "?java_opts"
        - name: SERVER_PORT
          value: "?app_port"
        resources:
          limits:
            cpu: ?cpu_limit
            memory: ?memory_limit
          requests:
            cpu: 200m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: ?health_check_path
            port: ?app_port
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: ?health_check_path
            port: ?app_port
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: ?module_name-service
  namespace: ?namespace
  labels:
    app: ?module_name
spec:
  selector:
    app: ?module_name
  ports:
  - port: 80
    targetPort: ?app_port
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ?module_name-ingress
  namespace: ?namespace
  labels:
    app: ?module_name
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: ?module_name.?namespace.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ?module_name-service
            port:
              number: 80


