apiVersion: apps/v1
kind: Deployment
metadata:
  name: ?module_name
  namespace: ?namespace
  labels:
    app: ?module_name
    type: frontend
spec:
  replicas: ?replicas
  selector:
    matchLabels:
      app: ?module_name
  template:
    metadata:
      labels:
        app: ?module_name
        type: frontend
    spec:
      containers:
      - name: ?module_name
        image: ?image_path
        ports:
        - containerPort: 80
          name: http
      imagePullSecrets:
      - name: ?harbor_secret_name
        env:
        - name: API_BASE_URL
          value: "?api_base_url"
        resources:
          limits:
            cpu: ?cpu_limit
            memory: ?memory_limit
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: ?module_name-service
  namespace: ?namespace
  labels:
    app: ?module_name
spec:
  selector:
    app: ?module_name
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  type: ClusterIP



