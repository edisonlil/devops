version: '3.8'

services:
  ?module_name:
    build:
      context: .
      dockerfile: dockerfile
    image: ?image_path
    container_name: ?module_name
    restart: unless-stopped
    ports:
      - "?app_port:?app_port"
    environment:
      - NODE_ENV=production
      - PORT=?app_port
      - APP_NAME=?module_name
    volumes:
      - ./logs:/app/logs
    networks:
      - ?module_name-network
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

networks:
  ?module_name-network:
    driver: bridge
